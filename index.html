<!-- plugins/metadata/m3u_player/index.html -->
<div class="m3u-root">
    <!-- [좌측] 비디오 플레이어 및 EPG 정보 영역 -->
    <section class="m3u-player-section">
        <div class="m3u-video-wrapper">
            <video id="m3uVideoPlayer" controls playsinline></video>
            <div id="m3uPlayerOverlay" class="m3u-overlay">
                <i class="fa-solid fa-circle-play m3u-overlay-icon"></i>
                <span id="m3uOverlayText">채널을 선택해주세요</span>
            </div>
        </div>
        
        <!-- 현재 재생 채널 및 EPG 정보 바 -->
        <div class="m3u-playing-bar">
            <div class="m3u-badge">ON AIR</div>
            <div class="m3u-playing-text">
                <div class="m3u-title-row">
                    <span id="m3uCurrentChannelTitle" class="m3u-title">재생 중인 채널이 없습니다</span>
                    <span id="m3uCurrentChannelGroup" class="m3u-group-badge">M3U</span>
                    <span id="m3uStreamEngineBadge" class="m3u-engine-badge">ENGINE</span>
                </div>
                <!-- 실시간 EPG 정보 표시 -->
                <div id="m3uCurrentEpgInfo" class="m3u-epg-now">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span id="m3uCurrentEpgText">편성표 정보 없음</span>
                </div>
            </div>
        </div>
    </section>

    <!-- [우측] 사이드바 (M3U/EPG 설정, 채널 검색 및 목록) -->
    <aside class="m3u-sidebar-section">
        <!-- 상단 URL 입력 및 빠른 설정 토글 -->
        <div class="m3u-toolbar">
            <div class="m3u-url-row">
                <input type="text" id="m3uUrlInput" class="m3u-input" placeholder="M3U URL 입력 (http://...)">
                <button id="m3uLoadBtn" class="m3u-btn m3u-btn-primary" title="M3U 목록 로드">
                    <i class="fa-solid fa-cloud-arrow-down"></i> 로드
                </button>
            </div>

            <div class="m3u-url-row">
                <input type="text" id="m3uEpgInput" class="m3u-input" placeholder="EPG (XMLTV) URL 입력 (선택)">
                <button id="m3uEpgLoadBtn" class="m3u-btn m3u-btn-secondary" title="EPG 편성표 로드">
                    <i class="fa-solid fa-table-list"></i> EPG
                </button>
            </div>

            <div class="m3u-btn-row">
                <label class="m3u-btn m3u-btn-outline m3u-file-btn" title="로컬 M3U 파일 열기">
                    <i class="fa-solid fa-folder-open"></i> 파일 열기
                    <input type="file" id="m3uFileInput" accept=".m3u,.m3u8" style="display:none;">
                </label>
                <button id="m3uSaveDefaultBtn" class="m3u-btn m3u-btn-outline" title="현재 입력된 주소를 브라우저 기본값으로 저장">
                    <i class="fa-solid fa-bookmark"></i> 기본값 저장
                </button>
            </div>
        </div>

        <!-- 검색 & 그룹 필터 -->
        <div class="m3u-filter-panel">
            <div class="m3u-search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="m3uSearchInput" class="m3u-input" placeholder="채널명 또는 프로그램 검색...">
            </div>
            <select id="m3uGroupSelect" class="m3u-select">
                <option value="">전체 그룹 (All)</option>
            </select>
        </div>

        <!-- 채널 개수 & EPG 상태 -->
        <div class="m3u-count-bar">
            <span>채널 목록 (<b id="m3uChannelCount">0</b>)</span>
            <span id="m3uEpgStatus" class="m3u-epg-status">EPG 미적용</span>
        </div>

        <!-- 채널 리스트 -->
        <div id="m3uChannelList" class="m3u-list-scroll">
            <div class="m3u-empty-state">M3U 목록을 불러와주세요.</div>
        </div>
    </aside>
</div>

<!-- 1. HLS.js (m3u8 스트리밍) -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<!-- 2. MPEGTS.js (TS 직접 스트림 / MPEG-TS / FLV 지원) -->
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
